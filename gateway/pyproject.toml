[project]
name = "mochi-gateway"
version = "0.4.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2,<3", "httpx>=0.28,<1", "cryptography>=45,<48", "tzdata>=2026.1", "pillow>=11,<13"]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2"]
diagnostics = ["piper-tts>=1.3,<2"]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "hermes_bridge", "speech", "phrases", "voice_cache", "voice_service", "weather", "device_context", "artifacts", "wake_jobs", "native_voice", "elevenlabs_voice", "turn_stream", "prompt_history", "clock_context", "memory_store", "memory_review", "fast_brain", "navigation", "navigation_api"]

[tool.pytest.ini_options]
pythonpath = ["."]
